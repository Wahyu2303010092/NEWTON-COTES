<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Newton-Cotes</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
      background-color: #111;
      border-radius: 10px;
      box-shadow: 0 0 10px #444;
    }
    h1, h2 {
      text-align: center;
    }
    label {
      display: block;
      margin-top: 15px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: none;
    }
    button {
      background-color: #fff;
      color: #000;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
    }
    .result {
      margin-top: 20px;
      padding: 10px;
      background-color: #222;
      border-radius: 5px;
    }
    canvas {
      background: #fff;
      margin-top: 20px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Kalkulator Newton-Cotes</h1>
    <p>Metode Trapesium & Simpson 1/3</p>

    <label for="fungsi">Fungsi (contoh: x*x + 2):</label>
    <input type="text" id="fungsi" placeholder="Masukkan fungsi" />

    <label for="a">Batas bawah (a):</label>
    <input type="number" id="a" />

    <label for="b">Batas atas (b):</label>
    <input type="number" id="b" />

    <label for="n">Jumlah segmen (n):</label>
    <input type="number" id="n" value="2" />

    <label for="toleransi">Toleransi galat (contoh: 0.001):</label>
    <input type="number" step="any" id="toleransi" value="0.001" />

    <button onclick="hitung()">Hitung</button>

    <div class="result" id="output"></div>

    <canvas id="plot" width="600" height="300"></canvas>

    <h2>Penjelasan Rumus</h2>
    <p><b>Trapesium:</b><br>
      \( \int_a^b f(x) dx \approx \frac{b-a}{2} [f(a) + f(b)] \)</p>
    <p><b>Simpson 1/3:</b><br>
      \( \int_a^b f(x) dx \approx \frac{b-a}{6} [f(a) + 4f(\frac{a+b}{2}) + f(b)] \)</p>
  </div>

  <script>
    function f(x, func) {
      return Function("x", "return " + func)(x);
    }

    function trapezoid(func, a, b) {
      return ((b - a) / 2) * (f(a, func) + f(b, func));
    }

    function simpson(func, a, b) {
      let m = (a + b) / 2;
      return ((b - a) / 6) * (f(a, func) + 4 * f(m, func) + f(b, func));
    }

    function hitung() {
      const func = document.getElementById("fungsi").value;
      const a = parseFloat(document.getElementById("a").value);
      const b = parseFloat(document.getElementById("b").value);
      const n = parseInt(document.getElementById("n").value);
      const tol = parseFloat(document.getElementById("toleransi").value);
      let h = (b - a) / n;

      let trapResult = 0;
      let simpResult = 0;
      let xData = [], yData = [];

      for (let i = 0; i < n; i++) {
        let x0 = a + i * h;
        let x1 = x0 + h;
        trapResult += trapezoid(func, x0, x1);
      }

      if (n % 2 !== 0) {
        document.getElementById("output").innerHTML =
          "<p style='color:red'>Untuk Simpson 1/3, n harus genap.</p>";
        return;
      }

      for (let i = 0; i < n; i += 2) {
        let x0 = a + i * h;
        let x2 = x0 + 2 * h;
        simpResult += simpson(func, x0, x2);
      }

      const galat = Math.abs(trapResult - simpResult);
      const hasil = galat <= tol ? simpResult : trapResult;

      document.getElementById("output").innerHTML = `
        <p><b>Hasil Trapesium:</b> ${trapResult.toFixed(6)}</p>
        <p><b>Hasil Simpson 1/3:</b> ${simpResult.toFixed(6)}</p>
        <p><b>Galat:</b> ${galat.toExponential(3)}</p>
        <p><b>Hasil Akhir (berdasarkan toleransi):</b> ${hasil.toFixed(6)}</p>
      `;

      // Plot
      xData = [], yData = [];
      for (let x = a; x <= b; x += (b - a) / 100) {
        xData.push(x);
        yData.push(f(x, func));
      }

      const ctx = document.getElementById("plot").getContext("2d");
      if (window.chart) window.chart.destroy();
      window.chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: xData,
          datasets: [{
            label: 'f(x)',
            data: yData,
            borderColor: 'black',
            backgroundColor: 'rgba(255,255,255,0.2)',
            fill: true,
            pointRadius: 0
          }]
        },
        options: {
          responsive: true,
          scales: {
            x: {
              title: {
                display: true,
                text: 'x',
                color: '#fff'
              },
              ticks: {
                color: '#fff'
              }
            },
            y: {
              title: {
                display: true,
                text: 'f(x)',
                color: '#fff'
              },
              ticks: {
                color: '#fff'
              }
            }
          },
          plugins: {
            legend: {
              labels: {
                color: '#fff'
              }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
